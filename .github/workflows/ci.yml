name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22.22.0'}
          - {os: ubuntu-latest, node: '24'}
          - {os: macos-latest, node: '24'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install TeX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-pictures texlive-latex-extra poppler-utils
      - run: npm run check
      - name: Browser tests
        if: runner.os == 'Linux' && matrix.node == '22.22.0'
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures-${{ matrix.os }}-${{ matrix.node }}
          path: |
            .cache/browser-*
            .cache/tricky-failures
          include-hidden-files: true
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Install full TeX and SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-full latexmk librsvg2-bin poppler-utils
      - run: npm run test:corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raft-regression
          path: |
            .cache/corpus/raft-report.json
            .cache/corpus/raft-provenance.json
            .cache/corpus/raft/.git/latex-review/logs
          include-hidden-files: true
